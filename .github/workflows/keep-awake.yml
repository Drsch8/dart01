name: Keep Supabase awake

# Supabase pauses a free project after 7 days of inactivity.
#
# History:
#   v1  anon SELECT through PostgREST  -> pause warning anyway (2026-09-07)
#   v2  anon PATCH of a heartbeat row  -> green daily, pause warning anyway
#   v3  (this file) behave like a real user of the project:
#         1. print the project ref, so it can be matched against the warning
#            email — a keepalive aimed at the wrong project looks identical
#         2. open a real Postgres session via the connection pooler and
#            INSERT / UPDATE / DELETE / SELECT on actual tables
#         3. the same REST reads the app makes, plus the heartbeat PATCH
#         4. touch Auth and Storage
#
# One-time setup:
#   - Run supabase/migrations/005_heartbeat_log.sql in the SQL editor.
#   - Add repo secret SUPABASE_DB_URL: Dashboard -> Connect -> "Session pooler"
#     URI, with the database password filled in. Use the pooler URI: the direct
#     db.<ref>.supabase.co host is IPv6-only and GitHub runners cannot reach it.
#   - SUPABASE_URL and SUPABASE_ANON_KEY stay as before.

on:
  schedule:
    # Twice daily, off the top of the hour (GitHub drops scheduled runs under
    # load, most often at :00). The window is 7 days, so many misses are fine.
    - cron: '17 5 * * *'
    - cron: '17 17 * * *'
  workflow_dispatch:        # also runnable by hand from the Actions tab

permissions:
  contents: write           # used only by the repo-keepalive step below

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check secrets and identify the project
        run: |
          # Check the secrets first. Without this, a missing URL surfaces only as
          # `curl: (3) URL using bad/illegal format`, which is a confusing way to
          # find out a secret is unset.
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is empty or not set."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is empty or not set."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *)
              echo "::error::SUPABASE_URL must start with https:// (value is ${#SUPABASE_URL} chars). Paste only the URL, not the whole NEXT_PUBLIC_SUPABASE_URL=... line."
              exit 1
              ;;
          esac

          base="${SUPABASE_URL%/}"   # tolerate a trailing slash on the secret
          host="${base#https://}"
          ref="${host%%.*}"
          echo "BASE=$base" >> "$GITHUB_ENV"

          # The ref is already public in the site's JS bundle; printing it is
          # the only way to confirm this job hits the project being warned about.
          echo "Project ref: $ref"
          {
            echo "## Supabase keepalive"
            echo ""
            echo "Project ref: \`$ref\` — must match the project named in any pause-warning email."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Direct Postgres session (pooler)
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. Add the Session pooler URI from Dashboard -> Connect (with the DB password). REST-only keepalives have already failed to prevent pause warnings."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL must start with postgresql:// (value is ${#SUPABASE_DB_URL} chars)."
              exit 1
              ;;
          esac

          # Take the password out of the URI and hand it to psql via PGPASSWORD.
          # Supabase shows the URI with the raw password pasted in, and a
          # password containing %, @, &, # etc. is not valid inside a URI —
          # psql then rejects it and echoes the offending fragment in its error.
          # GitHub only masks the secret as a whole, so that fragment (i.e. the
          # password) would be printed in a public log. Splitting on the LAST
          # '@' and the FIRST ':' after the scheme works for any password.
          rest="${SUPABASE_DB_URL#*://}"
          creds="${rest%@*}"
          hostpart="${rest##*@}"
          dbuser="${creds%%:*}"
          dbpass="${creds#*:}"
          if [ "$creds" = "$rest" ] || [ "$dbpass" = "$creds" ] || [ -z "$dbpass" ]; then
            echo "::error::SUPABASE_DB_URL has no user:password@ part. Paste the Session pooler URI with [YOUR-PASSWORD] replaced."
            exit 1
          fi
          # Accept an already URL-encoded password too: decode only when every
          # % starts a valid %XX escape; otherwise the % is part of the password.
          if [[ "$dbpass" == *%* ]] && ! printf '%s' "$dbpass" | grep -qE '%($|[^0-9A-Fa-f]|[0-9A-Fa-f]($|[^0-9A-Fa-f]))'; then
            dbpass=$(printf '%b' "${dbpass//%/\\x}")
          fi
          # Mask the bare password too (escaping % as workflow commands require).
          echo "::add-mask::${dbpass//%/%25}"
          export PGPASSWORD="$dbpass"
          dburl="postgresql://${dbuser}@${hostpart}"
          unset SUPABASE_DB_URL dbpass creds rest

          # psql is preinstalled on ubuntu-latest runners; install only if not.
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }

          set -o pipefail   # otherwise `| tee` hides a psql failure

          # One transaction of real work: insert + prune (WAL), update the
          # heartbeat, read the tables the app reads, then verify the write.
          psql "$dburl" -v ON_ERROR_STOP=1 -X -q -t -A <<'SQL' | tee psql.out
          BEGIN;
          INSERT INTO heartbeat_log (source) VALUES ('gh-actions');
          DELETE FROM heartbeat_log WHERE created_at < now() - interval '30 days';
          UPDATE heartbeat SET pinged_at = now() WHERE id = 1;
          SELECT 'match_summaries=' || count(*) FROM match_summaries;
          SELECT 'career_stats=' || count(*) FROM career_stats;
          SELECT 'heartbeat_log=' || count(*) FROM heartbeat_log;
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM heartbeat
                           WHERE id = 1 AND pinged_at > now() - interval '1 minute') THEN
              RAISE EXCEPTION 'heartbeat row missing or not updated — re-run 004_heartbeat.sql';
            END IF;
          END $$;
          SELECT 'pinged_at=' || pinged_at FROM heartbeat WHERE id = 1;
          COMMIT;
          SQL

          {
            echo "### Postgres session"
            echo '```'
            cat psql.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: REST traffic (same calls as the app)
        run: |
          fail=0
          call() {  # call <label> <curl args...>
            label="$1"; shift
            code=$(curl -sS -o body.json -w '%{http_code}' \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" "$@")
            echo "$label -> $code"
            echo "- $label → $code" >> "$GITHUB_STEP_SUMMARY"
            case "$code" in
              2*) return 0 ;;
              *) echo "::error::$label returned $code"; cat body.json || true; echo; fail=1; return 1 ;;
            esac
          }

          echo "### REST" >> "$GITHUB_STEP_SUMMARY"
          call "GET career_stats"    "$BASE/rest/v1/career_stats?select=*&limit=5" || true
          call "GET match_summaries" "$BASE/rest/v1/match_summaries?select=*&order=played_at.desc&limit=5" || true

          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if call "PATCH heartbeat" -X PATCH \
               -H "Content-Type: application/json" \
               -H "Prefer: return=representation" \
               -d "{\"pinged_at\":\"$now\"}" \
               "$BASE/rest/v1/heartbeat?id=eq.1"; then
            # An empty array means the PATCH matched nothing, so nothing was
            # written — a green run that did no work.
            if ! grep -q '"pinged_at"' body.json; then
              echo "::error::Heartbeat PATCH matched no rows. Row id=1 or its RLS update policy is missing; re-run supabase/migrations/004_heartbeat.sql."
              fail=1
            fi
          fi

          exit $fail

      - name: Auth and Storage (soft)
        run: |
          echo "### Auth / Storage" >> "$GITHUB_STEP_SUMMARY"
          for path in auth/v1/health auth/v1/settings storage/v1/bucket; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$BASE/$path") || code=000
            echo "GET /$path -> $code"
            echo "- GET /$path → $code" >> "$GITHUB_STEP_SUMMARY"
            # Informational: these services may be unused by the app.
            case "$code" in 2*) ;; *) echo "::warning::/$path returned $code" ;; esac
          done

      # This repo is public, so GitHub auto-disables scheduled workflows after
      # 60 days with no repository activity — which would silently switch off
      # the keepalive above. The guard means no commit is made while the repo is
      # being worked on normally.
      - uses: actions/checkout@v7
        if: always()        # keep the schedule alive even when Supabase fails
        with:
          fetch-depth: 0    # full clone; pushing from a shallow one can be rejected

      - name: Reset the 60-day scheduled-workflow clock
        if: always()
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Newest commit is $age day(s) old."
          if [ "$age" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
            echo "Pushed a keepalive commit."
          else
            echo "Repo is active; nothing to do."
          fi
